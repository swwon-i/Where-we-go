spring:
  application:
    name: where-we-go
  datasource:
    # docker-compose.yml 의 값과 같다. 운영이라면 환경변수로 뺄 자리다.
    url: ${WWG_DB_URL:jdbc:postgresql://localhost:5432/wherewego}
    username: ${WWG_DB_USER:wherewego}
    password: ${WWG_DB_PASSWORD:wherewego}
  # 스키마는 Flyway 컨테이너가 이미 적용해 둔다 (docker compose --profile migrate).
  # 서버 기동 때 다시 돌리지 않는다 — 적용 주체를 하나로 둔다.
  flyway:
    enabled: false

wwg:
  # 카카오맵 JavaScript 키. 저장소에 넣지 않는다 —
  # 환경변수 WWG_KAKAO_JS_KEY 나 server/.env 에서 읽는다 (둘 다 .gitignore 대상).
  kakao-js-key: ${WWG_KAKAO_JS_KEY:}
  # 관리자 로그인 아이디, 쉼표로 구분. 비우면 관리자가 없다(/admin 은 아무도 못 연다).
  # 저장소에 넣지 않는다 — 환경변수나 저장소 루트의 .env 에 WWG_ADMIN_LOGIN_IDS=... 로 둔다.
  admin-login-ids: ${WWG_ADMIN_LOGIN_IDS:}

server:
  port: 8080
  servlet:
    session:
      cookie:
        # 자바스크립트가 세션 쿠키를 읽지 못하게 한다. XSS 로 쿠키를 훔쳐가는 경로를 막는다.
        http-only: true
        # 다른 사이트에서 시작된 요청에는 쿠키를 붙이지 않는다. CSRF 토큰과 겹치는 방어지만
        # 둘 중 하나가 뚫려도 나머지가 남는다.
        same-site: lax
        # 운영에서는 true 여야 한다(HTTPS 전용). 로컬은 http 라 켜면 로그인이 안 된다.
        secure: ${WWG_COOKIE_SECURE:false}
      timeout: 7d

logging:
  level:
    org.springframework.jdbc.core: INFO
